name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-resume-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef0123456789abcdef
          DB_PASSWORD: ci-only
        run: mvn -B -ntp test

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-resume-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smart-resume-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
