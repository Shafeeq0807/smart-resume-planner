<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Smart Resume Planner banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <!-- decorative resume card -->
  <g transform="translate(860,40)">
    <rect width="220" height="220" rx="14" fill="#f8fafc" opacity="0.96"/>
    <rect x="22" y="26" width="110" height="12" rx="6" fill="#0f172a"/>
    <rect x="22" y="48" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="22" y="80" width="176" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="22" y="94" width="150" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="22" y="108" width="162" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="22" y="134" width="176" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="22" y="148" width="130" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="180" cy="176" r="26" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <path d="M168 176 l9 9 l16 -18" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
