  <text x="60" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Smart Resume Planner</text>
  <text x="60" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">ATS scoring · job matching · AI bullet optimizer · application tracker</text>
  <rect x="60" y="210" width="260" height="6" rx="3" fill="url(#accent)"/>
